app = "akj-nutrition-calorie-app"
primary_region = "ams"

[env]
  STREAMLIT_SERVER_ADDRESS = "0.0.0.0"
  STREAMLIT_SERVER_PORT = "8000"
  STREAMLIT_SERVER_HEADLESS = "true"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "get"
  path = "/_stcore/health"
  timeout = "5s"